<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Monitor Frame -->
  <rect x="12" y="14" width="40" height="27" rx="4" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="1.8" />
  
  <!-- Stand & Base -->
  <path d="M28 41 L27 47 H37 L36 41 Z" fill="#475569" />
  <rect x="24" y="47" width="16" height="2.5" rx="1.25" fill="#38bdf8" />

  <!-- Broadcast Arcs -->
  <path d="M42 22 A 6 6 0 0 1 42 32" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M46 19 A 11 11 0 0 1 46 35" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Lightning Bolt -->
  <polygon points="34,10 21,30 29,30 26,44 41,24 33,24" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" filter="url(#glow)" />
</svg>
